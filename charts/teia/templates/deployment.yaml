apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "teia.fullname" . }}
  labels:
    {{- include "teia.labels" . | nindent 4 }}
spec:
  # One pod: teia keeps the map in memory and a second replica would only
  # double the queries to your telemetry.
  replicas: 1
  selector:
    matchLabels:
      {{- include "teia.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "teia.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # A new teia.yaml restarts the pod; flows are re-read without one.
        checksum/config: {{ include "teia.config" . | sha256sum }}
        # teia leaves itself off the map it draws.
        teia.nilum.io/ignore: "true"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "teia.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.rbac.create }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: teia
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [serve]
          env:
            - name: TEIA_CONFIG
              value: /etc/teia/config/teia.yaml
            {{- with include "teia.authSecret" . }}
            - name: TEIA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: token
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/teia/config
              readOnly: true
            - name: flows
              mountPath: /etc/teia/flows
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "teia.fullname" . }}
        - name: flows
          configMap:
            name: {{ include "teia.flowsConfigMap" . }}
            optional: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
