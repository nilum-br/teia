apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "teia.fullname" . }}
  labels:
    {{- include "teia.labels" . | nindent 4 }}
data:
  teia.yaml: |
    {{- include "teia.config" . | nindent 4 }}
{{- if not .Values.flowsConfigMap }}
---
# Flows documents (files, not Kubernetes objects), mounted at /etc/teia/flows.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "teia.flowsConfigMap" . }}
  labels:
    {{- include "teia.labels" . | nindent 4 }}
{{- with .Values.flows }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
