{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "teia.serviceAccountName" . }}
  labels:
    {{- include "teia.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if .Values.rbac.create }}
---
# Read-only inventory: names, labels, owners and IPs of pods and Services.
# No Secrets, no exec, no logs, no writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "teia.fullname" . }}
  labels:
    {{- include "teia.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "teia.fullname" . }}
  labels:
    {{- include "teia.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "teia.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "teia.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
