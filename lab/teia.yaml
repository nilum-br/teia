# The lab's teia config: every signal the shop has, nothing installed for teia.
# Every key is described in docs/configuration.md. LAB_PROJECT is the compose
# project name (compose.yaml sets it), so a second lab started with -p only
# looks at its own containers.
listen: :8080
interval: 10s
history:
  directory: /var/lib/teia/history
  retention: 24h
  maxBytes: 67108864
  maxSnapshots: 2000

# Public browser destinations, independent of source credentials/addresses.
# These are service/time searches, never an exact trace/log correlation.
evidenceLinks:
  - label: Search traces for this service
    target: node
    kind: traces
    source: tempo
    url: ${GRAFANA_PUBLIC_URL:-http://localhost:3480}/explore
    explore:
      type: tempo
      datasourceUID: tempo
      query: '{ resource.service.name = {{id|json}} || span.peer.service = {{id|json}} || span.server.address = {{id|json}} }'
  - label: Search traces for these endpoints
    target: edge
    kind: traces
    source: tempo
    url: ${GRAFANA_PUBLIC_URL:-http://localhost:3480}/explore
    explore:
      type: tempo
      datasourceUID: tempo
      query: '({ resource.service.name = {{from|json}} } && { resource.service.name = {{to|json}} }) || { resource.service.name = {{from|json}} && (span.peer.service = {{to|json}} || span.server.address = {{to|json}}) }'
  - label: Search service logs
    target: node
    kind: logs
    source: loki/access-logs
    url: ${GRAFANA_PUBLIC_URL:-http://localhost:3480}/explore
    explore:
      type: loki
      datasourceUID: loki
      query: '{service={{id|json}}}'
  - label: Search caller logs
    target: edge
    kind: logs
    source: loki/access-logs
    url: ${GRAFANA_PUBLIC_URL:-http://localhost:3480}/explore
    explore:
      type: loki
      datasourceUID: loki
      query: '{service={{from|json}}}'
  - label: Service metrics dashboard
    target: node
    kind: dashboard
    source: prometheus
    url: ${GRAFANA_PUBLIC_URL:-http://localhost:3480}/d/teia-evidence
    params:
      var-service: '{{id}}'
      from: '{{period.fromMs}}'
      to: '{{period.toMs}}'
  - label: Connection metrics dashboard
    target: edge
    kind: dashboard
    source: prometheus
    url: ${GRAFANA_PUBLIC_URL:-http://localhost:3480}/d/teia-evidence
    params:
      var-service: '{{from}}'
      var-target: '{{to}}'
      from: '{{period.fromMs}}'
      to: '{{period.toMs}}'


# yellow from 1% errors, red from 5%
health:
  degraded: 0.01
  failing: 0.05

# changes between rounds can be pushed anywhere:
# notify:
#   webhooks:
#     - url: https://hooks.slack.com/services/...
#       format: slack
#       events: [edge.added, edge.health, node.health, finding.opened]
sources:
  # intent: flows files from the service repositories
  declared:
    paths: [/etc/teia/flows]

  # metrics: auto-detects service graph metrics (from traces) and Istio
  prometheus:
    - url: http://prometheus:9090
      window: 2m
      presets: [auto]

  # traces: a second, independent view straight from Tempo
  tempo:
    - url: http://tempo:3200
      window: 10m

  # logs: access logs name callers that have no telemetry of their own
  queries:
    - name: access-logs
      dialect: loki
      url: http://loki:3100
      window: 2m
      query: sum by (service, remote_addr) (rate({project="${LAB_PROJECT:-teia-lab}"} | json | __error__="" | msg="access" [$window]))
      # The same access lines that failed, so these edges have a health too.
      errors: sum by (service, remote_addr) (rate({project="${LAB_PROJECT:-teia-lab}"} | json | __error__="" | msg="access" | status >= 500 [$window]))
      from: remote_addr
      fromAddress: true
      to: service
      protocol: http

  # inventory: names, kinds and addresses of everything running. DOCKER_HOST
  # (set in compose.yaml) points at docker-proxy-teia, which only lets teia
  # list containers.
  docker:
    project: ${LAB_PROJECT:-teia-lab}

  # inside the database: who is connected
  postgres:
    - node: orders-db
      dsn: postgres://teia:${TEIA_PG_PASSWORD}@orders-db:5432/orders?sslmode=disable
