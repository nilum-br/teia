# Turns traces into service graph metrics (traces_service_graph_request_total)
# for Prometheus, and forwards the raw traces to Tempo. Tempo's
# metrics-generator can produce the same metrics instead.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  # "servicegraph" in Collector releases before the rename
  service_graph:
    latency_histogram_buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s]
    # Adds client_db_system / client_messaging_system labels so teia can
    # tell databases, caches and brokers apart from services, and which ones.
    dimensions: [db.system, messaging.system]
    # Draws an edge to things that never report spans themselves.
    virtual_node_peer_attributes: [peer.service, db.name, db.system]
    # SDKs batch spans for a few seconds; a short ttl turns late server
    # spans into bogus virtual nodes.
    store:
      ttl: 10s
      max_items: 5000
    metrics_flush_interval: 10s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  # raw traces, for the tempo source and for people
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [service_graph, otlp_grpc/tempo]
    metrics:
      receivers: [service_graph]
      exporters: [prometheus]
