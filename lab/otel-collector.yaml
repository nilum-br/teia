# Turns traces into service graph metrics (traces_service_graph_request_total)
# and exposes them for Prometheus. This is the same pipeline teia expects in
# production; Tempo's metrics-generator produces the same metrics.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  servicegraph:
    latency_histogram_buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s]
    # Adds client_db_system / server_db_system labels so teia can tell
    # databases and caches apart from services.
    dimensions: [db.system]
    # Draws an edge to things that never report spans themselves.
    virtual_node_peer_attributes: [peer.service, db.name, db.system]
    # SDKs batch spans for a few seconds; a short ttl turns late server
    # spans into bogus virtual nodes.
    store:
      ttl: 10s
      max_items: 5000
    metrics_flush_interval: 10s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [servicegraph]
    metrics:
      receivers: [servicegraph]
      exporters: [prometheus]
