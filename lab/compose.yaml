# teia lab: a small shop with the mix real platforms have. Part of it runs
# OpenTelemetry, part runs in an Istio mesh without OpenTelemetry, and some
# workloads emit nothing at all.
#
#   loadgen -> web -> orders -> payments -> payment-gateway   third party, no telemetry
#               |       \-> orders-db (postgres) <- legacy-reports   no telemetry: only the database knows
#               |-> catalog -> catalog-cache (redis) <- partner-sync   no telemetry: only access logs know
#               \-> recommendations -> inventory      mesh only (simulated Istio sidecars, no OpenTelemetry)
#   orders -> order-events (managed Kafka) <- email-worker -> email-provider (SaaS)
#   catalog -> catalog-db (managed MongoDB)      managed services: seen only through client spans
#
# Signals: traces -> OTel Collector -> service graph metrics (Prometheus) and
# Tempo; container logs -> Alloy -> Loki; sidecar metrics -> Prometheus.
#
# Run from the repository root:  docker compose -f lab/compose.yaml up -d --build
#
# The journey label says which journeys a service takes part in (a list for
# web): pick one on the map, or with the Journey variable in Grafana.
#
# Docker access: only the two socket proxies mount the Docker socket. teia and
# Alloy reach the Docker API through them, each limited to GET requests on the
# parts of the API it needs, and on a network of its own. Mounting docker.sock
# read-only (:ro) would restrict nothing: any client that can connect to the
# socket controls the Docker host.
#
# Published ports move with PROMETHEUS_PORT, TEMPO_PORT, LOKI_PORT,
# GRAFANA_PORT, TEIA_PORT and POSTGRES_PORT, and the project name with -p, so
# a second lab can run next to this one. They listen on this machine only:
# Grafana is anonymous and teia has no token here. LAB_BIND=0.0.0.0 opens them
# to the network, for a demo on another screen.
name: teia-lab

x-demo: &demo
  image: teia-lab/demo:dev
  build:
    context: ..
    dockerfile: lab/demo/Dockerfile
  restart: unless-stopped
  labels:
    teia.kind: service

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

x-infra: &infra
  restart: unless-stopped
  labels:
    teia.ignore: "true"

# A Docker API proxy that answers GET requests only, and only for the
# endpoints its environment enables (everything is off by default except
# EVENTS, PING and VERSION).
x-docker-proxy: &docker-proxy
  <<: *infra
  image: lscr.io/linuxserver/socket-proxy:3.4.6-r0-ls102
  read_only: true
  tmpfs: [/run]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes:
    - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock

services:
  # --- the shop: OpenTelemetry part -----------------------------------------
  web:
    <<: *demo
    labels:
      journey: "checkout,browse"
      teia.kind: service
      team: storefront
      system: shop
      tier: edge
      teia.tech: frontend
    environment:
      <<: *otel
      SERVICE_NAME: web
      CALLS: orders=http://orders:8080/,catalog=http://catalog:8080/,recommendations=http://recommendations:8080/

  orders:
    <<: *demo
    labels:
      journey: checkout
      teia.kind: service
      team: checkout
      system: shop
      tier: backend
    environment:
      <<: *otel
      SERVICE_NAME: orders
      CALLS: payments=http://payments:8080/
      POSTGRES_DSN: postgres://orders:orders@orders-db:5432/orders?sslmode=disable
      POSTGRES_PEER: orders-db
      PUBLISH: order-events=kafka
    depends_on:
      orders-db: { condition: service_healthy }

  catalog:
    <<: *demo
    labels:
      journey: browse
      teia.kind: service
      team: catalog
      system: shop
      tier: backend
    environment:
      <<: *otel
      SERVICE_NAME: catalog
      REDIS_ADDR: catalog-cache:6379
      REDIS_PEER: catalog-cache
      DOCDB: catalog-db=mongodb

  payments:
    <<: *demo
    labels:
      journey: checkout
      teia.kind: service
      team: checkout
      system: shop
      tier: backend
    environment:
      <<: *otel
      SERVICE_NAME: payments
      CALLS: payment-gateway=http://payment-gateway:8080/
      ERROR_RATE: "0.05"

  # --- the shop: mesh part (sidecar metrics, no OpenTelemetry) --------------
  recommendations:
    <<: *demo
    labels:
      journey: browse
      teia.kind: service
      team: catalog
      system: shop
      tier: backend
    environment:
      SERVICE_NAME: recommendations
      TELEMETRY: "off"
      MESH: istio
      MESH_NAMESPACE: shop-mesh
      CALLS: inventory=http://inventory:8080/

  inventory:
    <<: *demo
    labels:
      journey: browse
      teia.kind: service
      team: catalog
      system: shop
      tier: backend
    environment:
      SERVICE_NAME: inventory
      TELEMETRY: "off"
      MESH: istio
      MESH_NAMESPACE: shop-mesh
      # One answer in ten takes 900 ms (a lock, a cold cache): its p95 turns
      # amber, and so do its callers, which the map traces back to it.
      SLOW_RATE: "0.1"
      SLOW_FOR: 900ms

  # --- what nobody instrumented ---------------------------------------------
  # A third party we do not control: answers HTTP, emits no telemetry.
  payment-gateway:
    <<: *demo
    labels:
      teia.kind: external
      team: partners
      system: partners
      tier: external
    environment:
      SERVICE_NAME: payment-gateway
      TELEMETRY: "off"

  # A legacy job: only the database knows it exists.
  legacy-reports:
    <<: *demo
    labels:
      journey: reporting
      teia.kind: service
      team: finance
      system: backoffice
      tier: batch
      teia.tech: job
    environment:
      SERVICE_NAME: legacy-reports
      ROLE: legacy
      TELEMETRY: "off"
      INTERVAL: 5s
      POSTGRES_DSN: postgres://reports:reports@orders-db:5432/orders?sslmode=disable
    depends_on:
      orders-db: { condition: service_healthy }

  # Sends the order e-mails: consumes from the managed Kafka, calls a SaaS.
  email-worker:
    <<: *demo
    labels:
      journey: checkout
      teia.kind: service
      teia.tech: job
      team: checkout
      system: shop
      tier: worker
    environment:
      <<: *otel
      SERVICE_NAME: email-worker
      ROLE: consumer
      INTERVAL: 2s
      CONSUME: order-events=kafka
      NOTIFY: email-provider
      # Stands in for kafka_exporter: 1500 messages waiting, consumed at 20/s,
      # so the line to order-events says how much waits and how far behind.
      LAG_EXPORTER: ":9308"
      LAG: "1500"
      CONSUME_RATE: "20"

  # A partner integration calling catalog: only catalog's access log knows who.
  partner-sync:
    <<: *demo
    labels:
      journey: partner-feed
      teia.kind: service
      team: partners
      system: partners
      tier: batch
      teia.tech: job
    environment:
      SERVICE_NAME: partner-sync
      ROLE: loadgen
      TELEMETRY: "off"
      TARGET: http://catalog:8080/
      INTERVAL: 3s

  loadgen:
    <<: *demo
    labels:
      teia.ignore: "true"
    environment:
      <<: *otel
      SERVICE_NAME: loadgen
      ROLE: loadgen
      TARGET: http://web:8080/
      INTERVAL: 500ms
      # Alternate checkout and browse: two operations and two journeys on the
      # same frontend and database, for slices and sampled operations.
      OPERATION_ROUTES: "true"

  orders-db:
    image: postgres:18.6-alpine
    labels:
      journey: checkout
      teia.kind: database
      team: checkout
      system: shop
      tier: data
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # For teia running on the host (lab/teia.host.yaml).
    ports:
      - "${LAB_BIND:-127.0.0.1}:${POSTGRES_PORT:-5480}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "orders"]
      interval: 3s
      retries: 20

  catalog-cache:
    image: redis:8.10.2-alpine
    # A memory limit, so redis_exporter can say how full the cache is.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    labels:
      journey: browse
      teia.kind: cache
      team: catalog
      system: shop
      tier: data
    restart: unless-stopped

  # The exporter a platform runs next to Redis. teia reads its metrics from
  # Prometheus and puts them on catalog-cache, not on the exporter.
  catalog-cache-exporter:
    <<: *infra
    image: oliver006/redis_exporter:v1.95.0
    environment:
      REDIS_ADDR: redis://catalog-cache:6379
    depends_on: [catalog-cache]

  # --- observability the platform already has -------------------------------
  otel-collector:
    <<: *infra
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    <<: *infra
    image: prom/prometheus:v3.15.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${LAB_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9480}:9090"

  tempo:
    <<: *infra
    image: grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "${LAB_BIND:-127.0.0.1}:${TEMPO_PORT:-3280}:3200"

  loki:
    <<: *infra
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "${LAB_BIND:-127.0.0.1}:${LOKI_PORT:-3180}:3100"

  alloy:
    <<: *infra
    image: grafana/alloy:v1.21.2
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    environment:
      LAB_PROJECT: ${COMPOSE_PROJECT_NAME:-teia-lab}
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
    networks: [default, docker-alloy]
    depends_on: [docker-proxy-alloy]

  # Alloy's view of Docker: list and inspect containers, list networks
  # (discovery.docker), read container logs (loki.source.docker). The Docker
  # client pings the engine and asks its version, so PING and VERSION stay on.
  # The proxy closes a log stream after 10 minutes without output, and Alloy
  # picks it up again where it stopped: the "could not transfer logs ...
  # unexpected EOF" warnings in Alloy's log are that, nothing is lost.
  docker-proxy-alloy:
    <<: *docker-proxy
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      ALLOW_LOGS: 1
      EVENTS: 0
    networks: [docker-alloy]

  # Builds the teia Grafana panel (plugins/grafana) so the lab needs nothing
  # but Docker. Runs once; Grafana starts after it. It runs as root (the
  # node_modules volume starts out root-owned), then gives what it wrote into
  # the checkout (dist/ and the synced src/teia/teia-ui.js) to the checkout's
  # owner, so no root-owned files are left behind on Linux.
  teia-panel:
    image: node:26.12.1-trixie
    restart: "no"
    labels:
      teia.ignore: "true"
    working_dir: /repo/plugins/grafana
    command:
      - sh
      - -c
      - |
        set -e
        owner=$$(stat -c %u:%g .)
        trap 'chown -R "$$owner" dist src/teia/teia-ui.js 2>/dev/null || true' EXIT
        cat /repo/certs/*.crt > /tmp/extra-ca.pem 2>/dev/null || true
        export NODE_EXTRA_CA_CERTS=/tmp/extra-ca.pem
        npm install --global npm@12.2.0 && npm ci --no-audit --no-fund && npm run build
        # Grafana keeps a plugin's files for an hour under its version: each
        # lab build gets its own, so a browser never runs the build before.
        node -e "const f='dist/plugin.json',p=JSON.parse(require('fs').readFileSync(f));p.info.version+='-lab.'+Date.now().toString(36);require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
    volumes:
      - ..:/repo
      - teia-panel-node-modules:/repo/plugins/grafana/node_modules

  grafana:
    <<: *infra
    image: grafana/grafana:13.2.4
    depends_on:
      teia-panel: { condition: service_completed_successfully }
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: nilum-teia-panel
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # This loopback-only demo needs Explore for trace/log evidence links.
      # Production must use authenticated users with the appropriate Explore role.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource@4.1.1
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/teia.json
      # Extra CAs from ../certs for networks with TLS inspection (plugin download).
      SSL_CERT_DIR: /etc/ssl/certs:/etc/teia-certs
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../certs:/etc/teia-certs:ro
      - ../plugins/grafana/dist:/var/lib/grafana/plugins/nilum-teia-panel:ro
    ports:
      - "${LAB_BIND:-127.0.0.1}:${GRAFANA_PORT:-3480}:3000"

  # End-to-end check: docker compose -f lab/compose.yaml run --rm e2e
  e2e:
    <<: *demo
    profiles: [e2e]
    restart: "no"
    labels:
      teia.ignore: "true"
    environment:
      ROLE: e2e
      TEIA_URL: http://teia:8080
      PG_ADMIN_DSN: postgres://postgres:postgres@orders-db:5432/orders?sslmode=disable

  # --- teia -----------------------------------------------------------------
  # Runs as the image's non-root user, with a read-only root filesystem and no
  # capabilities: it reads Docker through docker-proxy-teia, not the socket.
  teia:
    <<: *infra
    image: teia-lab/teia:dev
    build:
      context: ..
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TEIA_PG_PASSWORD: teia
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:${GRAFANA_PORT:-3480}}
      DOCKER_HOST: tcp://docker-proxy-teia:2375 # also used by teia detect --docker
      LAB_PROJECT: ${COMPOSE_PROJECT_NAME:-teia-lab}
      # TEIA_LAB_UI_DIR=/ui serves the UI from internal/api/ui instead of the
      # copy built into the image: edits show on the next browser reload.
      TEIA_UI_DIR: ${TEIA_LAB_UI_DIR:-}
    volumes:
      - ./teia.yaml:/etc/teia/teia.yaml:ro
      - ./flows:/etc/teia/flows:ro
      - ../internal/api/ui:/ui:ro
      - teia-history:/var/lib/teia/history
    networks: [default, docker-teia]
    depends_on: [docker-proxy-teia]
    ports:
      - "${LAB_BIND:-127.0.0.1}:${TEIA_PORT:-8480}:8080"

  # teia's view of Docker: GET /containers/json (and, by the same rule,
  # /containers/{id}/json, which shows environment variables). Nothing else.
  docker-proxy-teia:
    <<: *docker-proxy
    environment:
      CONTAINERS: 1
      EVENTS: 0
      PING: 0
      VERSION: 0
    networks: [docker-teia]

networks:
  # Each proxy is reachable from its one client only.
  docker-teia:
    internal: true
  docker-alloy:
    internal: true

volumes:
  teia-history:
  teia-panel-node-modules:
