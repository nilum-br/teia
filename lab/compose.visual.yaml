# With the lab running:
# docker compose -f lab/compose.yaml -f lab/compose.visual.yaml run --build --rm visual
services:
  visual:
    profiles: [visual]
    build:
      context: ..
      dockerfile: lab/visual/Dockerfile
    init: true
    shm_size: 1gb
    labels:
      teia.ignore: "true"
    environment:
      GRAFANA_URL: http://grafana:3000
      TEIA_URL: http://teia:8080
    volumes:
      - ..:/repo
      - teia-panel-node-modules:/repo/plugins/grafana/node_modules
