apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  # Until the teia Grafana plugin exists, the Infinity data source reads the
  # teia API directly.
  - name: teia
    uid: teia
    type: yesoreyeram-infinity-datasource
    access: proxy
    jsonData:
      allowedHosts: ["http://teia:8080"]
