apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
  # The teia panel (nilum-teia-panel) is fed by dashboard queries. There is no
  # teia data source yet, so Infinity reads teia's /api/v1/grafana/* frames
  # from the Grafana server. With auth.token on teia, add the header
  # "Authorization: Bearer <token>" here as a secure value.
  - name: teia
    uid: teia
    type: yesoreyeram-infinity-datasource
    access: proxy
    jsonData:
      allowedHosts: ["http://teia:8080"]
