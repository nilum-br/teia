<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" font-family="'IBM Plex Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>teia map grammar</title>
  <rect width="1040" height="330" rx="12" fill="#0d1120"/>
  <defs><pattern id="blind" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M3.5 0V7" stroke="#6f7789"/></pattern></defs>
  <text x="32" y="44" fill="#e7eaf2" font-size="22" font-weight="600">How the map draws what teia sees, and what it does not</text>
  <text x="32" y="68" fill="#8790a3" font-size="13.5">A solid stroke is seen. A dashed one is only declared. A hatched card is a blind spot. Colour is health, and never alone.</text>
  <text x="32" y="98" fill="#b4bccc" font-size="13" font-weight="600">Communication</text>
  <path d="M32 132H128" stroke="#b4bccc" stroke-width="2"/>
  <text x="148" y="137" fill="#e7eaf2" font-size="13.5">declared and seen</text>
  <text x="148" y="155" fill="#8790a3" font-size="11.5">a flows file and the traffic agree</text>
  <path d="M32 196H128" stroke="#b4bccc" stroke-width="2"/>
  <rect x="71" y="187" width="18" height="18" rx="3" fill="#0d1120" stroke="#b4bccc" stroke-width="1.5"/>
  <path d="M75 196H85M80 191V201" stroke="#e7eaf2" stroke-width="1.8"/>
  <text x="148" y="201" fill="#e7eaf2" font-size="13.5">seen, not declared</text>
  <text x="148" y="219" fill="#8790a3" font-size="11.5">traffic no flows file mentions</text>
  <path d="M32 260H128" stroke-width="2" stroke="#868e9b" stroke-dasharray="5 4"/>
  <text x="148" y="265" fill="#e7eaf2" font-size="13.5">declared, not seen</text>
  <text x="148" y="283" fill="#8790a3" font-size="11.5">no traffic while the caller was visible</text>
  <text x="372" y="98" fill="#b4bccc" font-size="13" font-weight="600">Visibility</text>
  <rect x="372" y="116" width="96" height="32" rx="5" fill="#151a26" stroke="#b4bccc" stroke-width="1.5"/>
  <text x="488" y="137" fill="#e7eaf2" font-size="13.5">seen first-hand</text>
  <text x="488" y="155" fill="#8790a3" font-size="11.5">its own SDK, sidecar or eBPF probe</text>
  <rect x="372" y="180" width="96" height="32" rx="5" fill="#151a26" stroke="#b4bccc" stroke-width="1.5"/>
  <rect x="372" y="180" width="96" height="32" rx="5" fill="url(#blind)"/>
  <text x="488" y="201" fill="#e7eaf2" font-size="13.5">blind spot</text>
  <text x="488" y="219" fill="#8790a3" font-size="11.5">only its callers report it</text>
  <rect x="372" y="244" width="96" height="32" rx="5" fill="#151a26" stroke-width="1.5" stroke="#868e9b" stroke-dasharray="5 4"/>
  <text x="488" y="265" fill="#e7eaf2" font-size="13.5">no traffic seen</text>
  <text x="488" y="283" fill="#8790a3" font-size="11.5">known from an inventory or flows file</text>
  <text x="712" y="98" fill="#b4bccc" font-size="13" font-weight="600">Health</text>
  <path transform="translate(724 132) scale(1.3)" d="M-5,-5H5V5H-5Z" fill="#3fb27f"/>
  <text x="748" y="137" fill="#e7eaf2" font-size="13.5">healthy</text>
  <text x="748" y="155" fill="#8790a3" font-size="11.5">the icon takes the colour; the card stays quiet</text>
  <path transform="translate(724 196) scale(1.3)" d="M0,-6 L6,5 L-6,5 Z" fill="#e5a63a"/>
  <text x="748" y="201" fill="#e7eaf2" font-size="13.5">degraded</text>
  <text x="748" y="219" fill="#8790a3" font-size="11.5">amber outline and a tag with the reason (9 kinds)</text>
  <path transform="translate(724 260) scale(1.3)" d="M-5,-3 L-3,-5 L0,-2 L3,-5 L5,-3 L2,0 L5,3 L3,5 L0,2 L-3,5 L-5,3 L-2,0 Z" fill="#e5534b"/>
  <text x="748" y="265" fill="#e7eaf2" font-size="13.5">failing</text>
  <text x="748" y="283" fill="#8790a3" font-size="11.5">red outline and a tag with the reason</text>
</svg>
