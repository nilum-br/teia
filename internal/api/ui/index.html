<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231148ac'/%3E%3Cpath d='M16 6v20M6 16h20M9 9l14 14M23 9L9 23' stroke='%23c3fcff' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14181f; --muted: #5d6573; --line: #dde1e7;
    --accent: #1148ac; --accent-ink: #ffffff; --code: #f0f2f5;
    --full: #3f9e6e; --partial: #d39b2a; --none: #8a8f98;
    --ok: #8a8f98; --ghost: #d9822b; --stale: #b0b4ba;
    --critical: #c2413a; --warning: #b7791f; --info: #4a6fa5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #020e28; --panel: #0b1736; --ink: #e7ecf5; --muted: #97a3b8; --line: #1f2c4d;
      --accent: #c3fcff; --accent-ink: #020e28; --code: #071027;
      --ok: #6f7a8c; --stale: #4f5a6e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #020e28; --panel: #0b1736; --ink: #e7ecf5; --muted: #97a3b8; --line: #1f2c4d;
    --accent: #c3fcff; --accent-ink: #020e28; --code: #071027;
    --ok: #6f7a8c; --stale: #4f5a6e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  header .when { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  button, .btn { font: inherit; text-decoration: none; display: inline-block; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .coverage { display: flex; gap: 24px; flex-wrap: wrap; }
  .metric { min-width: 120px; }
  .metric b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .metric span { display: block; color: var(--muted); font-size: 12px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 420px; min-height: 0; }
  #graph { min-height: 420px; border-right: 1px solid var(--line); position: relative; }
  .legend { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--muted); z-index: 2; display: grid; grid-template-columns: auto auto; gap: 4px 14px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .ln { display: inline-block; width: 22px; height: 0; border-top: 2px solid; margin-right: 6px; vertical-align: 3px; }
  aside { overflow-y: auto; background: var(--panel); }
  aside section { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; display: flex; justify-content: space-between; }
  .filter { font-size: 12px; text-transform: none; letter-spacing: 0; }
  .finding { border: 1px solid var(--line); border-left: 3px solid var(--info); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
  .finding.critical { border-left-color: var(--critical); }
  .finding.warning { border-left-color: var(--warning); }
  .finding .meta { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .finding h3 { font-size: 14px; margin: 2px 0 6px; }
  .finding p { margin: 0 0 6px; color: var(--muted); }
  .finding .next { color: var(--ink); }
  details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; font-size: 12px; margin: 6px 0 0; }
  .src { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 13px; }
  .src .state { font-size: 11px; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); }
  .src .state.ok { color: var(--full); } .src .state.degraded { color: var(--warning); } .src .state.error { color: var(--critical); }
  .src small { display: block; color: var(--muted); }
  .empty { color: var(--muted); }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    #graph { height: 60vh; border-right: 0; border-bottom: 1px solid var(--line); }
    header { padding: 12px 16px; }
    aside section { padding: 14px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>teia</h1>
  <div class="coverage" id="coverage"></div>
  <div class="spacer"></div>
  <span class="when" id="when"></span>
  <a class="btn" href="api/v1/export/matrix.csv" download title="Flow matrix (CSV) for firewall and security reviews">Export matrix</a>
  <button class="primary" id="refresh" title="Reload the latest discovery round">Refresh</button>
</header>
<main>
  <div id="graph">
    <div class="legend">
      <span><i class="dot" style="background:var(--full)"></i>full visibility</span>
      <span><i class="ln" style="border-color:var(--ok)"></i>declared + observed</span>
      <span><i class="dot" style="background:var(--partial)"></i>seen via peers</span>
      <span><i class="ln" style="border-color:var(--ghost);border-top-style:dashed"></i>observed, undeclared</span>
      <span><i class="dot" style="background:var(--none)"></i>no traffic seen</span>
      <span><i class="ln" style="border-color:var(--stale);border-top-style:dotted"></i>declared, not observed</span>
    </div>
  </div>
  <aside>
    <section>
      <h2><span>Next steps</span><span class="filter" id="filter"></span></h2>
      <div id="findings"></div>
    </section>
    <section>
      <h2>Sources</h2>
      <div id="sources"></div>
    </section>
  </aside>
</main>
<script src="vendor/cytoscape.min.js"></script>
<script>
(() => {
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const el = (tag, attrs = {}, ...children) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) k === 'class' ? e.className = v : e.setAttribute(k, v);
    for (const c of children) e.append(c);
    return e;
  };
  let cy, selected = null, snapshot = null;

  const nodeShape = { database: 'barrel', cache: 'round-diamond', queue: 'round-tag', external: 'round-hexagon' };

  function style() {
    return [
      { selector: 'node', style: {
        'label': 'data(id)', 'font-size': 11, 'color': css('--ink'),
        'text-valign': 'bottom', 'text-margin-y': 6,
        'background-color': 'data(color)', 'width': 26, 'height': 26,
        'shape': 'data(shape)', 'border-width': 0 } },
      { selector: 'node.findings', style: { 'border-width': 2, 'border-color': css('--warning') } },
      { selector: 'node:selected', style: { 'border-width': 3, 'border-color': css('--accent') } },
      { selector: 'edge', style: {
        'curve-style': 'bezier', 'target-arrow-shape': 'triangle', 'arrow-scale': .8,
        'width': 'data(width)', 'line-color': 'data(color)', 'target-arrow-color': 'data(color)',
        'line-style': 'data(lineStyle)', 'label': 'data(label)', 'font-size': 9,
        'color': css('--muted'), 'text-background-color': css('--bg'),
        'text-background-opacity': 1, 'text-background-padding': 2 } },
      { selector: '.faded', style: { 'opacity': .18 } },
    ];
  }

  // Columns by longest path from the callers, so every edge points right;
  // inside a column, nodes sit next to the average height of their callers.
  function layered(snap) {
    const ids = snap.nodes.map(n => n.id);
    const depth = new Map(ids.map(id => [id, 0]));
    for (let i = 0; i < ids.length; i++) {
      let changed = false;
      for (const e of snap.edges) {
        const d = depth.get(e.from) + 1;
        if (d > depth.get(e.to) && d < ids.length) { depth.set(e.to, d); changed = true; }
      }
      if (!changed) break; // bounded: a cycle cannot loop forever
    }
    // A node nobody calls sits right before its nearest callee instead of in
    // column 0, so its edges do not cut across other columns.
    const called = new Set(snap.edges.map(e => e.to));
    for (const id of ids) {
      if (called.has(id)) continue;
      const targets = snap.edges.filter(e => e.from === id).map(e => depth.get(e.to));
      if (targets.length) depth.set(id, Math.max(0, Math.min(...targets) - 1));
    }
    const columns = [];
    for (const id of ids) (columns[depth.get(id)] ||= []).push(id);
    const pos = {};
    const bary = id => {
      const ys = snap.edges.filter(e => e.to === id && pos[e.from]).map(e => pos[e.from].y);
      return ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : 0;
    };
    columns.forEach((col, x) => {
      if (x > 0) col.sort((a, b) => bary(a) - bary(b));
      col.forEach((id, y) => { pos[id] = { x: x * 230, y: (y - (col.length - 1) / 2) * 120 }; });
    });
    return pos;
  }

  function render(snap) {
    const withFindings = new Set(snap.findings.map(f => f.subject));
    const vis = { full: css('--full'), partial: css('--partial'), none: css('--none') };
    const edgeColor = { ok: css('--ok'), ghost: css('--ghost'), stale: css('--stale') };
    const lineStyle = { ok: 'solid', ghost: 'dashed', stale: 'dotted' };
    const elements = [
      ...snap.nodes.map(n => ({ data: { id: n.id, color: vis[n.visibility], shape: nodeShape[n.kind] || 'ellipse' },
                               classes: withFindings.has(n.id) ? 'findings' : '' })),
      ...snap.edges.map(e => ({ data: {
        id: e.from + '->' + e.to, source: e.from, target: e.to,
        color: edgeColor[e.state], lineStyle: lineStyle[e.state],
        width: e.requestRate > 0 ? 2.5 : 1.5,
        label: e.requestRate > 0 ? e.requestRate.toFixed(1) + '/s' : (e.protocol || '') } })),
    ];
    if (cy) cy.destroy();
    const pos = layered(snap);
    cy = cytoscape({ container: document.getElementById('graph'), elements, style: style(),
                     layout: { name: 'preset', positions: n => pos[n.id()] }, boxSelectionEnabled: false });
    cy.fit(undefined, 40);
    cy.on('tap', 'node', ev => select(ev.target.id()));
    cy.on('tap', ev => { if (ev.target === cy) select(null); });
    if (selected && cy.getElementById(selected).nonempty()) select(selected);
  }

  function select(id) {
    selected = id;
    cy.elements().removeClass('faded');
    if (id) {
      const n = cy.getElementById(id);
      cy.elements().not(n.closedNeighborhood()).addClass('faded');
    }
    renderFindings();
  }

  function renderFindings() {
    const box = document.getElementById('findings');
    const filter = document.getElementById('filter');
    box.replaceChildren();
    let list = snapshot.findings;
    if (selected) {
      list = list.filter(f => f.subject === selected || f.subject.startsWith(selected + '->') || f.subject.endsWith('->' + selected));
      const clear = el('a', { href: '#' }, 'show all');
      clear.onclick = (e) => { e.preventDefault(); cy.$(':selected').unselect(); select(null); };
      filter.replaceChildren(selected + ' · ', clear);
    } else {
      filter.replaceChildren(String(list.length));
    }
    if (!list.length) box.append(el('p', { class: 'empty' }, selected ? 'Nothing to do here.' : 'Nothing to do. The picture is complete for the configured sources.'));
    for (const f of list) {
      const card = el('div', { class: 'finding ' + f.severity },
        el('div', { class: 'meta' }, f.severity + ' · ' + f.kind + ' · ' + f.subject),
        el('h3', {}, f.title));
      if (f.detail) card.append(el('p', {}, f.detail));
      if (f.fix) {
        card.append(el('p', { class: 'next' }, '→ ' + f.fix.summary));
        if (f.fix.snippet) card.append(el('details', {}, el('summary', {}, 'show ' + (f.fix.language || 'snippet')), el('pre', {}, f.fix.snippet)));
      }
      box.append(card);
    }
  }

  function renderSide(snap) {
    const pct = v => Math.round(v * 100) + '%';
    const metric = (label, v, hint) => el('div', { class: 'metric', title: hint },
      el('b', {}, pct(v)), el('div', { class: 'bar' }, Object.assign(el('i'), { style: 'width:' + pct(v) })), el('span', {}, label));
    document.getElementById('coverage').replaceChildren(
      metric('visibility', snap.coverage.visibility, 'Share of internal nodes that report their own telemetry'),
      metric('declared', snap.coverage.declared, 'Share of observed communication that is declared'),
      metric('observed', snap.coverage.observed, 'Share of declared communication that was observed'));
    document.getElementById('when').textContent = 'round at ' + new Date(snap.generatedAt).toLocaleTimeString();
    const sources = document.getElementById('sources');
    sources.replaceChildren(...snap.sources.map(s => el('div', { class: 'src' },
      el('div', {}, s.name, el('small', {}, s.message || (s.nodes + ' nodes, ' + s.edges + ' edges'))),
      el('span', { class: 'state ' + s.state }, s.state))));
  }

  async function load() {
    const res = await fetch('api/v1/snapshot');
    snapshot = await res.json();
    snapshot.findings = snapshot.findings || [];
    snapshot.nodes = snapshot.nodes || [];
    snapshot.edges = snapshot.edges || [];
    snapshot.sources = snapshot.sources || [];
    renderSide(snapshot);
    render(snapshot);
    renderFindings();
  }

  document.getElementById('refresh').onclick = load;
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => snapshot && render(snapshot));
  load();
})();
</script>
</body>
</html>
