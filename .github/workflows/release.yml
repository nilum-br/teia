name: release

# Push a tag vX.Y.Z to release. CI runs first; then the binaries (Linux, macOS
# and Windows, amd64 and arm64), Grafana panel zip and Helm chart are attached to a
# draft release, the multi-arch image and chart are pushed to ghcr.io, and only then is
# the release published. A tag with a hyphen (v1.2.0-rc.1) is a pre-release.
#
# Run it by hand (workflow_dispatch) to build everything without publishing,
# including when the selected ref is a tag. Only a tag push is a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Every job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # vX.Y.Z for a tag push, dev-<commit> for every manual run. Scripts read it from the
  # environment, never through ${{ }}, because a tag name is user input.
  VERSION: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  binaries:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # Release builds start clean: no cache restored from other runs.
          cache: false
      - name: build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="teia_${VERSION#v}_${os}_${arch}"
            bin=teia; [ "$os" = windows ] && bin=teia.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "build/$name/$bin" ./cmd/teia
            cp LICENSE NOTICE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error

  panel:
    needs: ci
    # A tag push waits for a maintainer's approval in the "release" environment,
    # which holds GRAFANA_ACCESS_POLICY_TOKEN. Every publishing job (draft, image,
    # chart-registry, publish) depends on this one, so nothing is published
    # before that approval. Manual runs build unsigned candidates without it.
    environment: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugins/grafana
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.12.0
          package-manager-cache: false
      - run: npm install --global npm@12.2.0
      - run: npm ci --no-audit --no-fund
      - name: version the panel as a release or unique candidate
        # plugin.json takes its version from package.json at build time.
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            panel_version="${VERSION#v}"
          else
            panel_version="0.0.0-candidate.${GITHUB_SHA}"
          fi
          npm pkg set "version=$panel_version"
          echo "PANEL_VERSION=$panel_version" >> "$GITHUB_ENV"
      - run: npm run build
      - name: sign the tagged plugin for public distribution
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        run: |
          if [ -z "$GRAFANA_ACCESS_POLICY_TOKEN" ]; then
            echo "::error::Tagged plugin releases require Grafana public-signature approval and the GRAFANA_ACCESS_POLICY_TOKEN secret (plugins:write). Use workflow_dispatch to build an unsigned candidate."
            exit 1
          fi
          npm run sign
          test -s dist/MANIFEST.txt
      - name: package nilum-teia-panel-<version>.zip
        # The layout Grafana expects: one top-level folder named after the plugin ID.
        run: |
          mkdir -p package
          cp -R dist package/nilum-teia-panel
          (cd package && zip -qr "nilum-teia-panel-${PANEL_VERSION}.zip" nilum-teia-panel)
          unzip -l "package/nilum-teia-panel-${PANEL_VERSION}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: panel
          path: plugins/grafana/package/*.zip
          if-no-files-found: error

  chart:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1
      - name: package the chart with the release's image tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            helm package charts/teia --version "${VERSION#v}" --app-version "${VERSION#v}" --destination dist
          else
            # A manual build validates the package without inventing a release.
            helm package charts/teia --destination dist
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chart
          path: dist/teia-*.tgz
          if-no-files-found: error

  draft:
    needs: [binaries, panel, chart]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # sign the build provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: binaries
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: panel
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: chart
          path: dist
      - name: checksums
        working-directory: dist
        run: |
          sha256sum -- * > checksums.txt
          cat checksums.txt
      - name: attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/checksums.txt
      - name: create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::release $TAG is already published; tag a new version instead"
              exit 1
            fi
            # A re-run: refresh the assets of the existing draft.
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --generate-notes --title "$TAG" "${prerelease[@]}"
          fi

  image:
    needs: draft
    # Also runs on manual runs, where draft is skipped, but never after a failure.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          # SBOM and full provenance, attached to the pushed image.
          sbom: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          provenance: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'mode=max' || 'false' }}

  chart-registry:
    needs: [draft, image]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: chart
          path: dist
      - name: push the chart after its image is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Keep OCI charts separate from the container image of the same name.
          helm push "dist/teia-${VERSION#v}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

  publish:
    needs: [draft, image, chart-registry]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # turn the draft into a published release
    steps:
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
