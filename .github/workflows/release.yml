name: release

# Push a tag vX.Y.Z to release. CI runs first; then the binaries (Linux, macOS
# and Windows, amd64 and arm64), Grafana panel zip and Helm chart are attached to a
# draft release, the multi-arch image and chart are pushed to ghcr.io, and only then is
# the release published. A tag with a hyphen (v1.2.0-rc.1) is a pre-release.
#
# Run it by hand (workflow_dispatch) to build everything without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Every job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # vX.Y.Z for a tag, dev-<commit> for a manual run. Scripts read it from the
  # environment, never through ${{ }}, because a tag name is user input.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  binaries:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Release builds start clean: no cache restored from other runs.
          cache: false
      - name: build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="teia_${VERSION#v}_${os}_${arch}"
            bin=teia; [ "$os" = windows ] && bin=teia.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "build/$name/$bin" ./cmd/teia
            cp LICENSE NOTICE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error

  panel:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugins/grafana
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          package-manager-cache: false
      - run: npm install --global npm@12.2.0
      - run: npm ci --no-audit --no-fund
      - name: version the panel like the release
        if: github.ref_type == 'tag'
        # plugin.json takes its version from package.json at build time.
        run: npm pkg set "version=${VERSION#v}"
      - run: npm run build
      - name: package nilum-teia-panel-<version>.zip
        # The layout Grafana expects: one top-level folder named after the plugin ID.
        run: |
          mkdir -p package
          cp -R dist package/nilum-teia-panel
          (cd package && zip -qr "nilum-teia-panel-${VERSION#v}.zip" nilum-teia-panel)
          unzip -l "package/nilum-teia-panel-${VERSION#v}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: panel
          path: plugins/grafana/package/*.zip
          if-no-files-found: error

  chart:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: package the chart with the release's image tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            helm package charts/teia --version "${VERSION#v}" --app-version "${VERSION#v}" --destination dist
          else
            # A manual build validates the package without inventing a release.
            helm package charts/teia --destination dist
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: dist/teia-*.tgz
          if-no-files-found: error

  draft:
    needs: [binaries, panel, chart]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # sign the build provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: panel
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: chart
          path: dist
      - name: checksums
        working-directory: dist
        run: |
          sha256sum -- * > checksums.txt
          cat checksums.txt
      - name: attest build provenance
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
      - name: create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::release $TAG is already published; tag a new version instead"
              exit 1
            fi
            # A re-run: refresh the assets of the existing draft.
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --generate-notes --title "$TAG" "${prerelease[@]}"
          fi

  image:
    needs: draft
    # Also runs on manual runs, where draft is skipped, but never after a failure.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          # SBOM and full provenance, attached to the pushed image.
          sbom: ${{ github.ref_type == 'tag' }}
          provenance: ${{ github.ref_type == 'tag' && 'mode=max' || 'false' }}

  chart-registry:
    needs: [draft, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - uses: actions/download-artifact@v8
        with:
          name: chart
          path: dist
      - name: push the chart after its image is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Keep OCI charts separate from the container image of the same name.
          helm push "dist/teia-${VERSION#v}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

  publish:
    needs: [draft, image, chart-registry]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # turn the draft into a published release
    steps:
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
