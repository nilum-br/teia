name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this first, so nothing that fails here is released.
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its previous run (one group per PR).
  # Pushes to main and release calls get a group per ref and commit, so a tag
  # on a commit main is still testing never waits on, or cancels, that run.
  # The "ci-" prefix keeps this apart from the release workflow's own group.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then go test -race ./...; else go test ./...; fi
      - run: go build -o teia-bin ./cmd/teia
      - name: cli smoke test
        shell: bash
        run: |
          ./teia-bin version
          ./teia-bin validate examples/flows/*.yaml lab/flows/*.yaml
      - name: lab demo builds
        working-directory: lab/demo
        run: go vet ./... && go build .

  resource-integration:
    name: resource diagnostics (PromQL and PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: teia-integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEIA_TEST_POSTGRES_URL: postgres://postgres:teia-integration-only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: install the Prometheus query validator
        run: |
          promtool_container=$(docker create prom/prometheus:v3.15.0)
          trap 'docker rm "$promtool_container" >/dev/null' EXIT
          promtool_path="$RUNNER_TEMP/promtool"
          docker cp "${promtool_container}:/bin/promtool" "$promtool_path"
          chmod +x "$promtool_path"
          "$promtool_path" --version
          echo "PROMTOOL=$promtool_path" >> "$GITHUB_ENV"
      - name: evaluate production queries and database permissions against controlled fixtures
        run: go test -race -count=1 -v ./internal/source/prometheus ./internal/source/postgres -run 'TestResourcePromQL|TestResourceDiagnosticsPostgres'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # The checks below run even when an earlier one fails, so one run reports them all.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.14.0
      - name: golangci-lint (lab/demo)
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          working-directory: lab/demo
          args: --config ../../.golangci.yml
      - name: go.mod and go.sum are tidy
        if: ${{ !cancelled() }}
        run: |
          go mod tidy -diff
          (cd lab/demo && go mod tidy -diff)
      - name: actionlint
        if: ${{ !cancelled() }}
        # Also runs shellcheck on every run: block (shellcheck is on the runner).
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          repo-checkout: false
          go-version-file: go.mod

  cross-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: build every release target
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/teia && echo "ok $target"
          done

  grafana-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/grafana
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.12.0
          cache: npm
          cache-dependency-path: plugins/grafana/package-lock.json
      - name: map component tests (teia-ui.js, shared with teia's own UI)
        working-directory: .
        run: node --test internal/api/teia-ui.test.mjs internal/api/ui-integration-audit.test.mjs
      - run: npm install --global npm@12.2.0
      - run: npm ci --no-audit --no-fund
      - run: npm run deps:audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nilum-teia-panel
          path: plugins/grafana/dist
          if-no-files-found: error

  helm-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1
      - name: lint defaults and all optional resources
        run: |
          helm lint charts/teia --strict
          helm lint charts/teia --strict -f charts/teia/ci/full-values.yaml
          helm template teia charts/teia -f charts/teia/ci/full-values.yaml > /dev/null
      - name: chart integration tests
        run: go test -v ./charts/tests
      - name: package chart
        run: helm package charts/teia --destination dist

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pull requests build the native platform only, without QEMU.
      # main and release calls build every platform the release publishes.
      PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: build ${{ env.PLATFORMS }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: teia:ci

  lab-e2e:
    runs-on: ubuntu-latest
    needs: [test, grafana-panel]
    timeout-minutes: 30
    env:
      COMPOSE_FILE: lab/compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: start the lab
        # Start data sources first; Grafana later loads the already-tested artifact.
        run: |
          mapfile -t services < <(docker compose config --services | grep -vxE 'grafana|teia-panel')
          docker compose up -d --build "${services[@]}"
      - name: check what teia finds
        run: docker compose run --rm e2e
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nilum-teia-panel
          path: plugins/grafana/dist
      - name: start Grafana with the tested plugin artifact
        run: |
          docker compose up -d --no-deps grafana
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 --retry-max-time 120 http://localhost:3480/api/health
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.12.0
          cache: npm
          cache-dependency-path: plugins/grafana/package-lock.json
      - name: validate the saved Grafana dashboard and plugin API
        working-directory: plugins/grafana
        run: |
          npm install --global npm@12.2.0
          npm ci --no-audit --no-fund
          npm run e2e -- --project=api
      - name: validate the rendered map and Grafana panel
        working-directory: plugins/grafana
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -- --project=chromium --workers=2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: visual-review
          path: plugins/grafana/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: lab logs on failure
        if: failure()
        run: |
          mkdir -p lab-logs
          docker compose ps --all > lab-logs/ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps > lab-logs/compose.log 2>&1 || true
          docker compose logs --no-color --tail 80 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: lab-logs
          path: lab-logs/
          retention-days: 14
      - name: stop the lab
        if: always()
        run: docker compose down -v --remove-orphans
