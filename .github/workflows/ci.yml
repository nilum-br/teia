name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/teia
      - name: lab demo builds
        working-directory: lab/demo
        run: go vet ./... && go build .
      - name: example flows are valid
        run: go run ./cmd/teia validate examples/flows/*.yaml lab/flows/*.yaml

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t teia:ci .
